name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
            install: pnpm install --frozen-lockfile
          - os: ubuntu-latest
            node: 22
            install: npx -y pnpm@11.0.0 install --frozen-lockfile
          - os: macos-latest
            node: 22
            install: pnpm install --frozen-lockfile
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: ${{ matrix.install }}
      - run: pnpm verify

  python-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libopus0
      - run: python -m pip install -r packages/audio/python/requirements.txt
      - run: python -m py_compile packages/audio/python/discord_native_sidecar.py
      - run: python packages/audio/python/discord_native_sidecar.py --probe

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: resound:ci
