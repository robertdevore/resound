name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libopus0
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r packages/audio/python/requirements.txt
      - run: pnpm release:check
      - run: pnpm verify
      - run: python packages/audio/python/discord_native_sidecar.py --probe
      - run: docker build -t resound:${GITHUB_REF_NAME#v} .
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
