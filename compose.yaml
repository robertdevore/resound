services:
  resound:
    build:
      context: .
    env_file:
      - .env
    environment:
      RESOUND_OUTPUT_DIR: /data/transcripts
      RESOUND_SIDECAR_STOP_TIMEOUT_MS: 15000
    init: true
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - ./transcripts:/data/transcripts
